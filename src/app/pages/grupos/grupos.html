<div class="flex justify-content-center p-6">
  <div class="w-full" style="max-width:1100px">

    <!-- HEADER -->
    <div class="flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="text-4xl font-bold text-color">Mis Grupos</h1>
        <p class="text-color-secondary">Selecciona un grupo</p>
      </div>

      <button 
        *ngIf="currentRole === 'super'"
        class="p-button p-button-sm p-button-success"
        (click)="abrirCrearGrupo()">
        <i class="pi pi-plus"></i>
        Nuevo Grupo
      </button>
    </div>

    <!-- GRID -->
    <div class="grid">

      <div class="col-12 md:col-6 lg:col-4" *ngFor="let grupo of grupos">

        <div class="surface-card border-1 surface-border border-round-xl p-4 hover:shadow-4 transition-duration-200">

          <!-- ICONO -->
          <div class="flex align-items-center gap-3 mb-3">
            <div class="flex align-items-center justify-content-center border-round bg-primary text-white"
                 style="width:45px;height:45px">
              <i [class]="grupo.icono + ' text-xl'"></i>
            </div>

            <div>
              <div class="font-bold text-white">{{ grupo.nombre }}</div>
              <div class="text-sm text-color-secondary">
                {{ grupo.miembros.length }} miembros
              </div>
            </div>
          </div>

          <!-- DESCRIPCIÓN -->
          <p class="text-sm text-color-secondary mb-4">
            {{ grupo.descripcion }}
          </p>

          <!-- ACCIONES -->
          <div class="flex justify-content-between align-items-center">

            <button class="p-button p-button-sm p-button-outlined"
                    [routerLink]="['/dashboard', grupo.id]">
              Entrar
            </button>

            <div class="flex gap-2">

              <button class="p-button p-button-rounded p-button-sm"
                      (click)="verGrupo(grupo)">
                <i class="pi pi-eye"></i>
              </button>

              <button *ngIf="currentRole === 'super'"
                      class="p-button p-button-rounded p-button-success p-button-sm"
                      (click)="editarGrupo(grupo)">
                <i class="pi pi-pencil"></i>
              </button>

              <button *ngIf="currentRole === 'super'"
                      class="p-button p-button-rounded p-button-info p-button-sm"
                      (click)="agregarMiembro(grupo)">
                <i class="pi pi-user-plus"></i>
              </button>

            </div>

          </div>

        </div>
      </div>

    </div>

  </div>
</div>

<!-- MODAL -->
<p-dialog 
  [(visible)]="displayModal"
  [modal]="true"
  [style]="{width: '420px'}"
  [contentStyle]="{'padding':'0'}">

  <div *ngIf="grupoSeleccionado" class="p-4">

    <div class="flex align-items-center gap-3 mb-4">
      <div class="flex align-items-center justify-content-center border-round-xl bg-primary text-white"
           style="width:55px;height:55px">
        <i [class]="grupoSeleccionado.icono + ' text-2xl'"></i>
      </div>

      <div>
        <div class="text-xl font-bold text-900">
          {{ grupoSeleccionado.nombre }}
        </div>
        <div class="text-sm text-color-secondary">
          {{ grupoSeleccionado.miembros.length }} miembros
        </div>
      </div>
    </div>

    <div class="mb-4 p-3 surface-100 border-round-lg text-sm">
      {{ grupoSeleccionado.descripcion }}
    </div>

    <div class="font-semibold mb-2">Miembros</div>

    <div *ngIf="grupoSeleccionado.miembros.length; else vacio"
         class="flex flex-wrap gap-2">

      <span *ngFor="let m of grupoSeleccionado.miembros"
            class="px-3 py-1 border-round-full text-xs bg-primary-100">
        {{ m }}
      </span>

    </div>

    <ng-template #vacio>
      <div class="text-sm text-color-secondary">
        Sin miembros
      </div>
    </ng-template>

  </div>

</p-dialog>

<!-- MODAL Para agregar grupo-->
<p-dialog 
  header="Nuevo Grupo"
  [(visible)]="displayCrearGrupo"
  [modal]="true"
  [style]="{width: '400px'}">

  <div class="flex flex-column gap-3">

    <!-- NOMBRE -->
    <div>
      <label class="block mb-1 font-semibold">Nombre</label>
      <input type="text" pInputText [(ngModel)]="nuevoGrupo.nombre" class="w-full">
    </div>

    <!-- DESCRIPCIÓN -->
    <div>
      <label class="block mb-1 font-semibold">Descripción</label>
      <input type="text" pInputText [(ngModel)]="nuevoGrupo.descripcion" class="w-full">
    </div>

    <!-- ICONO -->
    <div>
      <label class="block mb-1 font-semibold">Icono</label>
      <input type="text" pInputText [(ngModel)]="nuevoGrupo.icono" class="w-full"
             placeholder="Ej: pi pi-users">
    </div>

    <!-- BOTÓN -->
    <button class="p-button p-button-success w-full"
            (click)="guardarGrupo()">
      Crear Grupo
    </button>

  </div>

</p-dialog>
