<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f0f0f;">
  <div style="width: 400px;">
    <p-card>
      <h2 style="color:#1f2937; text-align:center; margin-bottom:24px;"> Crear Cuenta</h2>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="color:#6b7280;">Nombre completo</label>
          <input pInputText [(ngModel)]="nombre" placeholder="Tu nombre" style="width:100%;" />
        </div>

        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="color:#6b7280;">Correo electrónico</label>
          <input pInputText [(ngModel)]="email" placeholder="ejemplo@correo.com" style="width:100%;" />
        </div>

        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="color:#6b7280;">Contraseña</label>
          <input pInputText type="password" [(ngModel)]="password" placeholder="••••••••" style="width:100%;" />
        </div>

        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="color:#6b7280;">Confirmar contraseña</label>
          <input pInputText type="password" [(ngModel)]="confirmar" placeholder="••••••••" style="width:100%;" />
        </div>

        <p-button label="Registrarse" severity="success" styleClass="w-full" />

        <p style="text-align:center; color:#6b7280;">
          ¿Ya tienes cuenta?
          <a [routerLink]="['/login']" style="color:#2563eb;">Inicia sesión aquí</a>
        </p>

        <p-button label="Volver" severity="secondary" [routerLink]="['/landing']" styleClass="w-full" />
      </div>
    </p-card>
  </div>
</div>
